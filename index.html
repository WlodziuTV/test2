<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trasy Rowerowe & Supabase</title>
    
    <!-- Biblioteki Mapy Leaflet & Routing Machine -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.min.js"></script>

    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --border: #334155;
            --muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            padding: 20px;
        }

        .layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
        }

        .panel {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 88vh;
            overflow-y: auto;
        }

        h2 { color: var(--accent); font-size: 1.1rem; }

        .form-group { display: flex; flex-direction: column; gap: 8px; }

        input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--bg-color);
            color: var(--text);
        }

        button {
            padding: 10px;
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover { opacity: 0.9; }

        .route-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }

        .route-item {
            background-color: var(--bg-color);
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
        }

        .route-item:hover { border-color: var(--accent); }
        .route-item.active { border-color: var(--accent); background-color: #1e293b; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; }

        #map { height: 88vh; border-radius: 12px; border: 1px solid var(--border); }
        .time-inputs { display: flex; gap: 8px; }
        .time-inputs input { flex: 1; }
    </style>
</head>
<body>

<div class="layout">
    <div class="panel">
        <!-- 1. Formularz dodawania trasy -->
        <div>
            <h2>1. Nowa trasa</h2>
            <form id="saveRouteForm" class="form-group" style="margin-top: 8px;">
                <input type="text" id="routeName" placeholder="Nazwa nowej trasy..." required>
                <button type="submit">Zapisz trasę w chmurze</button>
            </form>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border);">

        <!-- 2. Lista zapisanych tras -->
        <div>
            <h2>2. Wybierz trasę</h2>
            <ul id="routeList" class="route-list" style="margin-top: 8px;"></ul>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border);">

        <!-- 3. Wyniki dla trasy -->
        <div>
            <h2 id="activeRouteHeader">3. Ranking trasy</h2>
            
            <form id="addScoreForm" class="form-group" style="margin-top: 10px;">
                <input type="text" id="userName" placeholder="Twoja nazwa / Nick" required>
                <div class="time-inputs">
                    <input type="number" id="timeMin" placeholder="Minuty" min="0" required>
                    <input type="number" id="timeSec" placeholder="Sekundy" min="0" max="59" required>
                </div>
                <button type="submit">Dodaj swój czas</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Gracz</th>
                        <th>Czas</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Kontener na mapę -->
    <div id="map"></div>
</div>

<script>
    // --- PODMIEŃ DANE Z PANELU SUPABASE ---
    const SUPABASE_URL = "WKLEJ_TUTAJ_SWOJ_URL"; // Bez ukośnika / na końcu!
    const SUPABASE_KEY = "WKLEJ_TUTAJ_SWOJ_KLUCZ_ANON";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Inicjalizacja Mapy
    const map = L.map('map').setView([52.2297, 21.0122], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

    const routingControl = L.Routing.control({
        waypoints: [L.latLng(52.2297, 21.0122), L.latLng(52.2450, 21.0300)],
        router: L.Routing.osrmv1({ profile: 'biking' }),
        routeWhileDragging: true
    }).addTo(map);

    let routes = [];
    let selectedRoute = null;

    // Pobieranie tras z Supabase
    async function loadRoutes() {
        const { data, error } = await db.from('routes').select('*').order('id', { ascending: false });
        if (error) {
            console.error("Błąd pobierania tras:", error);
            return;
        }
        
        routes = data || [];
        renderRouteList();

        if (routes.length > 0 && !selectedRoute) {
            selectRoute(routes[0]);
        }
    }

    function renderRouteList() {
        const listEl = document.getElementById('routeList');
        listEl.innerHTML = '';

        if (routes.length === 0) {
            listEl.innerHTML = `<li style="font-size:0.85rem; color:var(--muted);">Brak zapisanych tras. Wyznacz pierwszą!</li>`;
            return;
        }

        routes.forEach((route) => {
            const li = document.createElement('li');
            li.className = `route-item ${selectedRoute && selectedRoute.id === route.id ? 'active' : ''}`;
            li.innerText = route.name;
            li.addEventListener('click', () => selectRoute(route));
            listEl.appendChild(li);
        });
    }

    function selectRoute(route) {
        selectedRoute = route;
        routingControl.setWaypoints([
            L.latLng(route.start_lat, route.start_lng),
            L.latLng(route.end_lat, route.end_lng)
        ]);
        renderRouteList();
        loadScores(route.id);
    }

    // Zapis nowej trasy w Supabase
    document.getElementById('saveRouteForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const waypoints = routingControl.getWaypoints();
        const name = document.getElementById('routeName').value.trim();

        if (waypoints.length < 2 || !waypoints[0].latLng) {
            return alert("Wyznacz najpierw trasę na mapie!");
        }

        const { error } = await db.from('routes').insert([{
            name: name,
            start_lat: waypoints[0].latLng.lat,
            start_lng: waypoints[0].latLng.lng,
            end_lat: waypoints[waypoints.length - 1].latLng.lat,
            end_lng: waypoints[waypoints.length - 1].latLng.lng
        }]);

        if (error) {
            console.error("Błąd zapisu:", error);
            return alert("Błąd zapisu w bazie: " + error.message);
        }

        document.getElementById('routeName').value = '';
        await loadRoutes();
    });

    // Pobieranie czasów dla wybranej trasy
    async function loadScores(routeId) {
        document.getElementById('activeRouteHeader').innerText = `3. Ranking: ${selectedRoute.name}`;
        const { data, error } = await db.from('scores')
            .select('*')
            .eq('route_id', routeId)
            .order('total_seconds', { ascending: true });

        const tbody = document.getElementById('leaderboardBody');
        tbody.innerHTML = '';

        if (error) {
            console.error("Błąd pobierania wyników:", error);
            return;
        }

        if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color: var(--muted);">Brak wyników. Bądź pierwszy!</td></tr>`;
            return;
        }

        data.forEach((entry, idx) => {
            tbody.innerHTML += `<tr><td>${idx + 1}</td><td>${escapeHTML(entry.username)}</td><td>${entry.formatted_time}</td></tr>`;
        });
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    // Zapis nowego czasu
    document.getElementById('addScoreForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!selectedRoute) return alert("Najpierw wybierz trasę z listy!");

        const user = document.getElementById('userName').value.trim();
        const min = parseInt(document.getElementById('timeMin').value, 10) || 0;
        const sec = parseInt(document.getElementById('timeSec').value, 10) || 0;
        const total = (min * 60) + sec;
        const formatted = `${min}m ${sec < 10 ? '0' : ''}${sec}s`;

        if (total <= 0) return alert("Wprowadź prawidłowy czas!");

        const { error } = await db.from('scores').insert([{
            route_id: selectedRoute.id,
            username: user,
            total_seconds: total,
            formatted_time: formatted
        }]);

        if (error) {
            console.error("Błąd zapisu czasu:", error);
            return alert("Błąd zapisu czasów: " + error.message);
        }

        document.getElementById('userName').value = '';
        document.getElementById('timeMin').value = '';
        document.getElementById('timeSec').value = '';
        loadScores(selectedRoute.id);
    });

    // Start aplikacji
    loadRoutes();
</script>

</body>
</html>
