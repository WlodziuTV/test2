<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Trasy Rowerowe & Supabase</title>
    
    <!-- Leaflet & Routing Machine -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.min.js"></script>

    <!-- Biblioteka Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; --border: #334155; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        .layout { display: grid; grid-template-columns: 380px 1fr; gap: 20px; max-width: 1400px; margin: 0 auto; }
        .panel { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 15px; max-height: 88vh; overflow-y: auto; }
        h2 { color: var(--accent); font-size: 1.1rem; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        input, button { padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
        button { background: var(--accent); color: #000; font-weight: bold; cursor: pointer; border: none; }
        .route-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .route-item { background: var(--bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; }
        .route-item.active { border-color: var(--accent); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid var(--border); }
        #map { height: 88vh; border-radius: 12px; border: 1px solid var(--border); }
        .time-inputs { display: flex; gap: 8px; } .time-inputs input { flex: 1; }
    </style>
</head>
<body>

<div class="layout">
    <div class="panel">
        <div>
            <h2>1. Dodaj nową trasę</h2>
            <form id="saveRouteForm" class="form-group" style="margin-top:8px;">
                <input type="text" id="routeName" placeholder="Nazwa trasy..." required>
                <button type="submit">Zapisz trasę w chmurze</button>
            </form>
        </div>

        <hr style="border-color: var(--border);">

        <div>
            <h2>2. Wybierz trasę</h2>
            <ul id="routeList" class="route-list" style="margin-top:8px;"></ul>
        </div>

        <hr style="border-color: var(--border);">

        <div>
            <h2 id="activeRouteHeader">3. Ranking</h2>
            <form id="addScoreForm" class="form-group" style="margin-top:10px;">
                <input type="text" id="userName" placeholder="Twój Nick" required>
                <div class="time-inputs">
                    <input type="number" id="timeMin" placeholder="Min" min="0" required>
                    <input type="number" id="timeSec" placeholder="Sek" min="0" max="59" required>
                </div>
                <button type="submit">Dodaj czas</button>
            </form>

            <table>
                <thead><tr><th>#</th><th>Gracz</th><th>Czas</th></tr></thead>
                <tbody id="leaderboardBody"></tbody>
            </table>
        </div>
    </div>

    <div id="map"></div>
</div>

<script>
    // --- KONFIGURACJA SUPABASE ---
    const SUPABASE_URL = "PODMIEŃ_NA_TWOJ_URL";
    const SUPABASE_KEY = "PODMIEŃ_NA_TWOJ_KLUCZ_ANON";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Inicjalizacja Mapy
    const map = L.map('map').setView([52.2297, 21.0122], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    const routingControl = L.Routing.control({
        waypoints: [L.latLng(52.2297, 21.0122), L.latLng(52.2450, 21.0300)],
        router: L.Routing.osrmv1({ profile: 'biking' }),
        routeWhileDragging: true
    }).addTo(map);

    let routes = [];
    let selectedRoute = null;

    // Pobieranie tras z Supabase
    async function loadRoutes() {
        const { data, error } = await db.from('routes').select('*').order('id', { ascending: false });
        if (error) return alert("Błąd pobierania tras: " + error.message);
        
        routes = data;
        renderRouteList();

        if (routes.length > 0 && !selectedRoute) {
            selectRoute(routes[0]);
        }
    }

    function renderRouteList() {
        const listEl = document.getElementById('routeList');
        listEl.innerHTML = '';

        routes.forEach((route) => {
            const li = document.createElement('li');
            li.className = `route-item ${selectedRoute && selectedRoute.id === route.id ? 'active' : ''}`;
            li.innerText = route.name;
            li.addEventListener('click', () => selectRoute(route));
            listEl.appendChild(li);
        });
    }

    function selectRoute(route) {
        selectedRoute = route;
        routingControl.setWaypoints([
            L.latLng(route.start_lat, route.start_lng),
            L.latLng(route.end_lat, route.end_lng)
        ]);
        renderRouteList();
        loadScores(route.id);
    }

    // Dodawanie nowej trasy do Supabase
    document.getElementById('saveRouteForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const waypoints = routingControl.getWaypoints();
        const name = document.getElementById('routeName').value;

        const { data, error } = await db.from('routes').insert([{
            name: name,
            start_lat: waypoints[0].latLng.lat,
            start_lng: waypoints[0].latLng.lng,
            end_lat: waypoints[waypoints.length - 1].latLng.lat,
            end_lng: waypoints[waypoints.length - 1].latLng.lng
        }]).select();

        if (error) return alert("Błąd zapisu: " + error.message);
        
        document.getElementById('routeName').value = '';
        await loadRoutes();
        selectRoute(data[0]);
    });

    // Pobieranie wyników dla wybranej trasy
    async function loadScores(routeId) {
        document.getElementById('activeRouteHeader').innerText = `3. Ranking: ${selectedRoute.name}`;
        const { data, error } = await db.from('scores')
            .select('*')
            .eq('route_id', routeId)
            .order('total_seconds', { ascending: true });

        const tbody = document.getElementById('leaderboardBody');
        tbody.innerHTML = '';

        if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">Brak wyników.</td></tr>`;
            return;
        }

        data.forEach((entry, idx) => {
            tbody.innerHTML += `<tr><td>${idx + 1}</td><td>${entry.username}</td><td>${entry.formatted_time}</td></tr>`;
        });
    }

    // Dodawanie wyniku do Supabase
    document.getElementById('addScoreForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!selectedRoute) return alert("Wybierz trasę!");

        const user = document.getElementById('userName').value;
        const min = parseInt(document.getElementById('timeMin').value, 10) || 0;
        const sec = parseInt(document.getElementById('timeSec').value, 10) || 0;
        const total = (min * 60) + sec;
        const formatted = `${min}m ${sec < 10 ? '0' : ''}${sec}s`;

        const { error } = await db.from('scores').insert([{
            route_id: selectedRoute.id,
            username: user,
            total_seconds: total,
            formatted_time: formatted
        }]);

        if (error) return alert("Błąd zapisu czasów: " + error.message);

        document.getElementById('userName').value = '';
        document.getElementById('timeMin').value = '';
        document.getElementById('timeSec').value = '';
        loadScores(selectedRoute.id);
    });

    // Start aplikacji
    loadRoutes();
</script>

</body>
</html>
